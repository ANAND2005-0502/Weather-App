
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌤 Weather App</h1>
        <p class="subtitle">Check Live Weather Anywhere</p>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >
            <button id="searchBtn">Search</button>
        </div>

        <p id="error" class="error"></p>

        <div class="weather-box" id="weatherBox">
            <h2 id="cityName">New Delhi</h2>

            <img id="weatherIcon"
                src="https://openweathermap.org/img/wn/01d@2x.png"
                alt="Weather icon">

            <h1 id="temperature">--°C</h1>
            <h3 id="condition">Weather Condition</h3>

            <div class="details">
                <div class="detail">
                    <h3>💧</h3>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail">
                    <h3>💨</h3>
                    <p>Wind Speed</p>
                    <h3 id="wind">-- m/s</h3>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
